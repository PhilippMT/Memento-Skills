# Memento-Skills: Kiro Reflection Hook
#
# Triggers after source file saves to record development patterns
# and enable reflective learning through the Memento ACP server.

name: memento-reflect
description: >
  Record development activity for Memento reflective learning.
  Tracks file modifications to improve skill recommendations
  and identify common development patterns.

trigger:
  type: file_save
  pattern: "src/**/*"

action:
  type: shell
  command: |
    MEMENTO_URL="http://127.0.0.1:47200"

    # Record the file save event for pattern analysis
    curl -s --max-time 5 -X POST "${MEMENTO_URL}/reflect" \
      -H "Content-Type: application/json" \
      -d '{
        "tool_name": "file_save",
        "result_type": "success",
        "result_text": "File saved: '"${KIRO_FILE_PATH:-unknown}"'"
      }' >/dev/null 2>&1 || true
  timeout: 5
