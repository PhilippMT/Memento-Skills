# Memento-Skills: Kiro Sync Hook
#
# Triggers when files are saved in the skills directory,
# syncing Memento skills to Kiro-native format.
#
# This hook ensures that any changes to Memento skills are
# automatically reflected in the Kiro skill library.

name: memento-sync
description: >
  Sync Memento-Skills to Kiro format when skill files change.
  This keeps the Kiro skill library up-to-date with the latest
  Memento skill definitions and improvements.

trigger:
  type: file_save
  pattern: "**/skills/**/*.md"

action:
  type: shell
  command: |
    MEMENTO_URL="http://127.0.0.1:47200"

    # Check if ACP server is running
    health=$(curl -s --max-time 3 "${MEMENTO_URL}/health" 2>/dev/null || echo "")

    if echo "$health" | grep -q '"status":"ok"'; then
      # Sync skills
      curl -s --max-time 10 -X POST "${MEMENTO_URL}/sync" \
        -H "Content-Type: application/json" \
        -d '{"target": "kiro", "workspace": "'"$(pwd)"'"}' \
        >/dev/null 2>&1
      echo "[memento] Skills synced to Kiro format"
    fi
  timeout: 15
