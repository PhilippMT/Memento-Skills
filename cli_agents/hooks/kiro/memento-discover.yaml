# Memento-Skills: Kiro Discovery Hook
#
# Manually triggered hook for searching Memento skills
# relevant to the current task context.

name: memento-discover
description: >
  Search Memento-Skills library for relevant skills based on
  the current file context. Use this to find specialized
  knowledge and tools for your current development task.

trigger:
  type: manual

action:
  type: shell
  command: |
    MEMENTO_URL="http://127.0.0.1:47200"
    QUERY="${KIRO_SELECTION:-${KIRO_FILE_PATH:-general development}}"

    # Discover relevant skills
    result=$(curl -s --max-time 10 -X POST "${MEMENTO_URL}/discover" \
      -H "Content-Type: application/json" \
      -d '{"query": "'"${QUERY}"'", "k": 5}' 2>/dev/null)

    if [ -n "$result" ]; then
      echo "$result" | jq -r '.skills[] | "[\(.relevance_score)] \(.name): \(.description)"' 2>/dev/null || echo "$result"
    else
      echo "[memento] ACP server not available. Start with: memento serve --daemon"
    fi
  timeout: 10
